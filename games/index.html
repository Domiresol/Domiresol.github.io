<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미니 퍼즐</title>
<style>
  /* 색상: noravoca와 같은 테마 값. 테마 선택은 localStorage 'theme'을 공유해 게임 안팎에서 유지됩니다. */
  :root {
    color-scheme: light;
    --bg: #f3f3f3; --panel: #fff; --text: #222; --muted: #777; --line: #ddd; --soft: #f3f3f3;
    --accent: #ffe14d; --accent-line: #f5c400; --g: #7ddc8c; --y: #ffe082; --b: #c8c8c8; --on-tile: #222;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --bg: #121213; --panel: #1c1c1e; --text: #ececec; --muted: #9a9a9e; --line: #3a3a3c; --soft: #2a2a2d;
      --g: #3f9e55; --y: #c9a227; --b: #4a4a4d; --on-tile: #fff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121213; --panel: #1c1c1e; --text: #ececec; --muted: #9a9a9e; --line: #3a3a3c; --soft: #2a2a2d;
    --g: #3f9e55; --y: #c9a227; --b: #4a4a4d; --on-tile: #fff;
  }
  :root[data-theme="darker"] {
    color-scheme: dark;
    --bg: #181818; --panel: #1f1f1f; --text: #cccccc; --muted: #9d9d9d; --line: #2b2b2b; --soft: #2a2d2e;
    --accent: #0078d4; --accent-line: #0078d4; --g: #2f6b3c; --y: #7d6a1f; --b: #262626; --on-tile: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .brand { font-weight: 800; letter-spacing: -.02em; }
  #theme { width: 36px; height: 36px; padding: 0; border: 1px solid var(--line); border-radius: 50%;
           background: none; color: inherit; font-size: 1.05rem; cursor: pointer; }
  #theme:hover { background: var(--soft); }

  .intro { padding: 28px 0 32px; }
  .intro h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 5vw, 2.2rem); letter-spacing: -.03em; line-height: 1.25; }
  .intro p { margin: 0; color: var(--muted); line-height: 1.6; }

  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .list-head h2 { margin: 0; font-size: 1rem; }
  .list-head span { color: var(--muted); font-size: .85rem; }

  /* 게임 카드: 화면 폭에 맞춰 1~3열로 늘어남 */
  .games { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
           grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 18px; border-radius: 16px;
          background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none;
          transition: transform .15s, border-color .15s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent-line); outline: none; }
  .thumb { display: flex; gap: 4px; }
  .thumb i { font-style: normal; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
             border-radius: 8px; font-weight: 700; color: var(--on-tile); background: var(--b); }
  .thumb .g { background: var(--g); }
  .thumb .y { background: var(--y); }
  .card h3 { margin: 0; font-size: 1.1rem; }
  .card p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: .75rem; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .card .go { font-weight: 700; font-size: .9rem; }
  .card.soon { border-style: dashed; background: none; align-items: center; justify-content: center; text-align: center;
               min-height: 200px; color: var(--muted); }

  footer { margin-top: 40px; color: var(--muted); font-size: .75rem; text-align: center; }
</style>
<script>
  // 저장된 테마를 그리기 전에 적용 (noravoca와 같은 키)
  try { const t = localStorage.getItem('theme'); if (['light', 'dark', 'darker'].includes(t)) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">미니 퍼즐</span>
    <button id="theme" type="button"></button>
  </header>

  <section class="intro">
    <h1>잠깐 쉬어 갈 때,<br>머리 쓰는 작은 퍼즐 한 판</h1>
    <p>설치도 가입도 없이 브라우저에서 바로 즐기는 미니 퍼즐 모음입니다.<br>
       '매일 새 문제' 게임은 날짜와 번호가 같으면 모두 같은 문제가 나와서 친구와 결과를 비교할 수 있어요.</p>
  </section>

  <div class="list-head">
    <h2>게임 고르기</h2>
    <span id="count"></span>
  </div>
  <ul class="games" id="games"></ul>

  <footer>새 게임은 계속 추가될 예정입니다.</footer>
</div>

<script>
// 게임 목록: 새 게임은 폴더를 만들고 여기에 한 줄만 추가하면 카드가 생깁니다.
// thumb: 카드 위에 보여 줄 타일 [글자, 색(g/y/b)]
const GAMES = [
  {
    path: 'noravoca/',
    name: '자모 맞추기',
    desc: '단어를 자모로 풀어 6번 안에 맞히는 한국어 단어 퍼즐. 초성·음절 수 힌트도 있어요.',
    tags: ['단어', '매일 새 문제', '쉬움·어려움'],
    thumb: [['ㅈ', 'g'], ['ㅏ', 'y'], ['ㅁ', 'b'], ['ㅗ', 'g']],
  },
  {
    path: 'sliding/',
    name: '슬라이딩 퍼즐',
    desc: '빈칸으로 숫자 타일을 밀어 1부터 순서대로 맞추는 퍼즐. 섞인 판은 항상 풀 수 있어요.',
    tags: ['숫자', '3×3 ~ 5×5'],
    thumb: [['1', 'g'], ['2', 'g'], ['4', 'b'], ['3', 'y']],
  },
  {
    path: 'lightsout/',
    name: '불 끄기',
    desc: '누르면 십자 모양으로 불이 뒤집혀요. 모든 불을 끄면 성공하는 논리 퍼즐.',
    tags: ['논리', '3×3 ~ 5×5'],
    thumb: [['', 'y'], ['', 'b'], ['', 'y'], ['', 'y']],
  },
  {
    path: '2048/',
    name: '2048',
    desc: '같은 숫자를 밀어 합쳐 2048을 만드는 게임. 방향키와 화면 밀기를 모두 지원해요.',
    tags: ['숫자', '최고 점수 기록'],
    thumb: [['2', 'b'], ['4', 'y'], ['8', 'y'], ['16', 'g']],
  },
  {
    path: 'minesweeper/',
    name: '지뢰찾기',
    desc: '숫자 힌트로 지뢰를 피해 모든 칸을 여는 고전 퍼즐. 첫 칸은 항상 안전해요.',
    tags: ['논리', '초급·중급·고급'],
    thumb: [['1', 'b'], ['2', 'b'], ['🚩', 'y'], ['💣', 'b']],
  },
  {
    path: 'baseball/',
    name: '숫자야구',
    desc: '스트라이크·볼 힌트로 비밀 숫자를 10번 안에 추리하는 게임.',
    tags: ['추리', '3·4자리'],
    thumb: [['1', 'g'], ['5', 'y'], ['9', 'b'], ['?', 'b']],
  },
  {
    path: 'wordchain/',
    name: '끝말잇기',
    desc: '컴퓨터와 번갈아 끝 글자로 시작하는 명사를 대는 게임. 표준국어대사전 명사 21만 개로 판정해요.',
    tags: ['단어', '두음 법칙 허용', '쉬움·보통·어려움'],
    thumb: [['기', 'y'], ['차', 'g'], ['표', 'y'], ['범', 'g']],
  },
  {
    path: 'sudoku/',
    name: '스도쿠',
    desc: '가로·세로·3×3 칸에 1~9를 겹치지 않게 채우는 숫자 퍼즐. 답은 항상 하나예요.',
    tags: ['숫자', '매일 새 문제', '메모 기능'],
    thumb: [['5', 'b'], ['3', 'g'], ['', 'b'], ['7', 'y']],
  },
  {
    path: 'pipes/',
    name: '파이프 연결',
    desc: '파이프 조각을 돌려 가운데 수원에서 모든 칸으로 물길을 잇는 퍼즐.',
    tags: ['논리', '매일 새 문제', '5×5 ~ 9×9'],
    thumb: [['┏', 'y'], ['━', 'y'], ['┓', 'b'], ['┃', 'b']],
  },
  {
    path: 'wordsearch/',
    name: '단어 찾기',
    desc: '글자 격자 속에 가로·세로·대각선으로 숨은 낱말을 모두 찾는 게임.',
    tags: ['단어', '매일 새 문제', '6×6 ~ 10×10'],
    thumb: [['사', 'g'], ['과', 'g'], ['본', 'b'], ['름', 'b']],
  },
  {
    path: 'nonogram/',
    name: '노노그램',
    desc: '줄마다 적힌 숫자 힌트로 칠할 칸을 찾아내는 네모 로직. 답은 항상 하나예요.',
    tags: ['논리', '매일 새 문제', '5×5 ~ 15×15'],
    thumb: [['', 'b'], ['', 'g'], ['', 'g'], ['', 'b']],
  },
  {
    path: 'flow/',
    name: '색 점 잇기',
    desc: '같은 색 점끼리 선으로 이어 판을 빈칸 없이 가득 채우는 퍼즐.',
    tags: ['논리', '매일 새 문제', '5색 ~ 10색'],
    thumb: [['●', 'y'], ['─', 'y'], ['●', 'y'], ['●', 'g']],
  },
];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => `&${{ '&': 'amp', '<': 'lt', '>': 'gt', '"': 'quot' }[c]};`);

$('count').textContent = `${GAMES.length}개`;
$('games').innerHTML = GAMES.map(g => `
  <li><a class="card" href="${esc(g.path)}">
    <div class="thumb" aria-hidden="true">${g.thumb.map(([ch, c]) => `<i class="${c}">${esc(ch)}</i>`).join('')}</div>
    <h3>${esc(g.name)}</h3>
    <p>${esc(g.desc)}</p>
    <div class="tags">${g.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <span class="go">플레이 →</span>
  </a></li>`).join('') + `
  <li><div class="card soon">새 퍼즐 준비 중<br>곧 만나요</div></li>`;

// 테마 토글: 라이트 → 다크 → 더 다크 (noravoca와 같은 순서·키)
const root = document.documentElement;
const THEMES = { light: ['☀️', '라이트'], dark: ['🌙', '다크'], darker: ['🌑', '더 다크'] };
const ORDER = Object.keys(THEMES);
const theme = () => THEMES[root.dataset.theme] ? root.dataset.theme
  : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
const nextTheme = () => ORDER[(ORDER.indexOf(theme()) + 1) % ORDER.length];
function paintTheme() {
  $('theme').textContent = THEMES[theme()][0];
  $('theme').title = `${THEMES[theme()][1]} 모드 (누르면 ${THEMES[nextTheme()][1]} 모드)`;
  $('theme').setAttribute('aria-label', $('theme').title);
}
$('theme').onclick = () => {
  root.dataset.theme = nextTheme();
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
  paintTheme();
};
paintTheme();
</script>
</body>
</html>

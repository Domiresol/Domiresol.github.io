<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자모 맞추기</title>
<style>
  :root { --g: #7ddc8c; --y: #ffe082; --b: #c8c8c8; --key: #fff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3f3f3; color: #222;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  header { width: 100%; max-width: 420px; padding: 12px 16px; background: #fff; font-weight: 700;
           display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; text-align: center; }
  #home { color: #222; text-decoration: none; font-size: .85rem; padding: 4px 0; border: 1px solid #ddd;
          border-radius: 999px; }
  #home:hover { background: #f3f3f3; }
  .mid { grid-column: 2; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .nav { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center;
         border-radius: 50%; color: #222; text-decoration: none; font-size: 1.4rem; line-height: 1; }
  .nav:hover { background: #f3f3f3; }
  .nav.off { visibility: hidden; }
  #date { display: block; font-size: .75rem; font-weight: 400; color: #888; margin-top: 2px; }
  main { width: 100%; max-width: 420px; padding: 16px; background: #fff; }
  input, button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #ccc; }
  #msg button { background: #ffe14d; border: 0; font-weight: 700; cursor: pointer; }

  /* 시작 화면 */
  #entry { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 0 8px; text-align: center; }
  #entry > .field, #entry > .seg, #entry > .start, #entry > .legend { width: 100%; max-width: 300px; }
  .logo { display: flex; gap: 6px; }
  .logo i, .legend i { font-style: normal; display: inline-flex; align-items: center; justify-content: center;
                       border-radius: 10px; border: 2px solid; font-weight: 700; }
  .logo i { width: 48px; height: 48px; font-size: 1.5rem; }
  .logo i:nth-child(odd) { transform: rotate(-4deg); }
  .logo i:nth-child(even) { transform: rotate(3deg); }
  h1 { margin: 4px 0 0; font-size: 1.6rem; letter-spacing: -.02em; }
  .date-pill { margin: 0; padding: 6px 14px; border-radius: 999px; background: #f3f3f3; font-size: .9rem; font-weight: 600; }
  .desc { margin: 0; color: #666; font-size: .9rem; line-height: 1.5; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 600; color: #777; text-align: left; }
  .field input { font-size: 1.4rem; font-weight: 700; text-align: center; padding: 12px; border: 2px solid #ddd; border-radius: 12px; }
  .field input:focus { outline: none; border-color: #f5c400; }
  .start { padding: 14px; border: 0; border-radius: 12px; background: #ffe14d; font-weight: 700; font-size: 1.05rem;
           cursor: pointer; box-shadow: 0 3px 0 #e0c200; }
  .start:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0c200; }
  .legend { list-style: none; margin: 6px 0 0; padding: 14px; border-radius: 12px; background: #fafafa;
            display: flex; flex-direction: column; gap: 8px; font-size: .85rem; color: #555; text-align: left; }
  .legend li { display: flex; align-items: center; gap: 10px; }
  .legend i { width: 28px; height: 28px; flex: none; font-size: .95rem; }
  /* 난이도 선택: 라디오 버튼을 카드처럼 표시 */
  .seg { display: flex; gap: 8px; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; }
  .seg span { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px;
              border: 2px solid #ddd; border-radius: 12px; font-weight: 700; cursor: pointer;
              transition: border-color .15s, background .15s; }
  .seg small { font-weight: 400; font-size: .75rem; color: #777; }
  .seg input:checked + span { border-color: #f5c400; background: #fff7cc; }
  .seg input:focus-visible + span { outline: 2px solid #222; outline-offset: 2px; }
  #grid { display: grid; gap: 6px; margin: 0 auto; }
  .tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px;
          border: 2px solid #ddd; font-size: 1.4rem; font-weight: 700; transition: background .3s; }
  .tile.filled { border-color: #999; }
  .g { background: var(--g) !important; border-color: var(--g) !important; }
  .y { background: var(--y) !important; border-color: var(--y) !important; }
  .b { background: var(--b) !important; border-color: var(--b) !important; }
  #hintbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-top: 12px; }
  #hintBtn { background: #fff; border: 1px solid #ddd; border-radius: 999px; padding: 6px 14px; font-size: .9rem; cursor: pointer; }
  #hintBtn:disabled { opacity: .5; cursor: default; }
  #hint { font-weight: 600; color: #555; }
  #msg { min-height: 2.5em; margin: 12px 0; text-align: center; font-weight: 600; }
  #kb { width: 100%; max-width: 420px; padding: 10px 6px 20px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 5px; justify-content: center; }
  .row button { flex: 1; max-width: 40px; height: 50px; padding: 0; border: 0; background: var(--key);
                font-size: 1.05rem; cursor: pointer; }
  .row button.wide { max-width: 64px; font-size: .9rem; }
  footer { font-size: .75rem; color: #888; padding: 8px 16px 20px; text-align: center; }
</style>
</head>
<body>
<header hidden>
  <a id="home" href="?">홈</a>
  <span class="mid">
    <a id="prev" class="nav" aria-label="이전 문제">‹</a>
    <span><span id="title">자모 맞추기</span><small id="date"></small></span>
    <a id="next" class="nav" aria-label="다음 문제">›</a>
  </span>
</header>

<main>
  <form id="entry" hidden>
    <div class="logo" aria-hidden="true"><i class="g">ㅈ</i><i class="y">ㅏ</i><i class="b">ㅁ</i><i class="g">ㅗ</i></div>
    <h1>자모 맞추기</h1>
    <p class="date-pill" id="today"></p>
    <p class="desc">단어를 자모로 풀어 6번 안에 맞혀 보세요.<br>같은 날 같은 번호·난이도면 모두 같은 문제예요.</p>
    <label class="field">문제 번호
      <input name="n" type="number" inputmode="numeric" min="1" max="9999" required placeholder="1 ~ 9999" autofocus>
    </label>
    <div class="seg" role="radiogroup" aria-label="난이도">
      <label><input type="radio" name="d" value="easy" checked><span>쉬움<small>자모 5·6개</small></span></label>
      <label><input type="radio" name="d" value="hard"><span>어려움<small>자모 6·7개</small></span></label>
    </div>
    <button class="start">시작하기</button>
    <ul class="legend">
      <li><i class="g">ㄱ</i>자리와 자모가 모두 맞음</li>
      <li><i class="y">ㅏ</i>자모는 있지만 자리가 다름</li>
      <li><i class="b">ㅂ</i>정답에 없는 자모</li>
    </ul>
  </form>
  <div id="game" hidden>
    <div id="grid"></div>
    <div id="hintbar"><button id="hintBtn">💡 힌트</button><span id="hint"></span></div>
    <div id="msg"></div>
  </div>
</main>
<div id="kb" hidden></div>
<footer>단어 출처: 국립국어원 표준국어대사전 (CC BY-SA), 한국어 학습용 어휘 목록</footer>

<script src="words.js"></script>
<script src="jamo.js"></script>
<script>
const ROWS = 6;
// 난이도별 자모 수와 학습용 어휘 등급(A가 가장 쉬움). check.js와 같아야 합니다.
const LEVELS = {
  easy: { name: '쉬움', lengths: [5, 6], grades: 'AB' },
  hard: { name: '어려움', lengths: [6, 7], grades: 'BC' },
};
const date = kstDate();
const params = new URLSearchParams(location.search);
const num = parseInt(params.get('n'), 10);
const level = params.get('d') === 'hard' ? 'hard' : 'easy'; // 없거나 잘못되면 쉬움
const $ = id => document.getElementById(id);

// '2026-11-18' -> '2026년 11월 18일 (수)'
function fmtDate(d) {
  const [y, m, day] = d.split('-').map(Number);
  return `${y}년 ${m}월 ${day}일 (${'일월화수목금토'[new Date(Date.UTC(y, m - 1, day)).getUTCDay()]})`;
}

if (!(num >= 1)) {
  $('today').textContent = fmtDate(date);
  $('entry').hidden = false;
} else {
  start();
}

function start() {
  // 난이도에 맞는 자모 수·등급의 정답을 한 목록으로 합쳐 고르고, 칸 수는 정답 길이를 따릅니다.
  const { lengths, grades } = LEVELS[level];
  const all = lengths.flatMap(n => [...grades].flatMap(g => WORDS[n][g]));
  const answerWord = all[pickIndex(date, num, all.length)];
  const answer = toJamo(answerWord);
  const COLS = answer.length;
  const valid = new Set(WORDS[COLS].valid.map(w => toJamo(w).join('')));
  const tiles = [];
  const keys = {};
  const rank = { b: 1, y: 2, g: 3 };
  const history = [];
  let row = 0, cur = [], done = false;

  // 힌트: 누를 때마다 음절 수, 초성 순으로 하나씩 공개
  const SYL_CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const HINTS = [
    `${answerWord.length}글자`,
    `초성 ${[...answerWord].map(c => SYL_CHO[Math.floor((c.charCodeAt(0) - 0xAC00) / 588)]).join('')}`,
  ];
  let hintsUsed = 0;
  $('hintBtn').onclick = () => {
    hintsUsed++;
    $('hint').textContent = HINTS.slice(0, hintsUsed).join(' · ');
    $('hintBtn').disabled = hintsUsed === HINTS.length;
  };

  $('title').textContent = `${num}번 · ${LEVELS[level].name} · 자모 ${COLS}개`;
  $('date').textContent = fmtDate(date);
  // 같은 난이도로 이전·다음 번호 이동 (1~9999 범위 밖이면 숨김)
  $('prev').href = `?n=${num - 1}&d=${level}`;
  $('next').href = `?n=${num + 1}&d=${level}`;
  $('prev').classList.toggle('off', num <= 1);
  $('next').classList.toggle('off', num >= 9999);
  $('game').hidden = $('kb').hidden = document.querySelector('header').hidden = false;
  Object.assign($('grid').style, { gridTemplateColumns: `repeat(${COLS}, 1fr)`, maxWidth: `${COLS * 60}px` });

  for (let i = 0; i < ROWS * COLS; i++) {
    const t = document.createElement('div');
    t.className = 'tile';
    $('grid').append(t);
    tiles.push(t);
  }

  // 화면 키보드 (2벌식 배열, 복합 자모 없음)
  [['ㅂ', 'ㅈ', 'ㄷ', 'ㄱ', 'ㅅ', 'ㅛ', 'ㅕ', 'ㅑ', '⌫'],
   ['ㅁ', 'ㄴ', 'ㅇ', 'ㄹ', 'ㅎ', 'ㅗ', 'ㅓ', 'ㅏ', 'ㅣ'],
   ['입력', 'ㅋ', 'ㅌ', 'ㅊ', 'ㅍ', 'ㅠ', 'ㅜ', 'ㅡ']].forEach(r => {
    const div = document.createElement('div');
    div.className = 'row';
    r.forEach(k => {
      const b = document.createElement('button');
      b.textContent = k;
      if (k.length > 1 || k === '⌫') b.className = 'wide';
      b.onclick = () => press(k);
      keys[k] = b;
      div.append(b);
    });
    $('kb').append(div);
  });

  // 물리 키보드: 한/영 상태와 무관하게 키 위치(e.code)로 매핑. ㅐ·ㄲ 등은 분해해서 입력
  const CODE = { KeyQ: 'ㅂ', KeyW: 'ㅈ', KeyE: 'ㄷ', KeyR: 'ㄱ', KeyT: 'ㅅ', KeyY: 'ㅛ', KeyU: 'ㅕ', KeyI: 'ㅑ',
    KeyO: 'ㅏㅣ', KeyP: 'ㅓㅣ', KeyA: 'ㅁ', KeyS: 'ㄴ', KeyD: 'ㅇ', KeyF: 'ㄹ', KeyG: 'ㅎ', KeyH: 'ㅗ',
    KeyJ: 'ㅓ', KeyK: 'ㅏ', KeyL: 'ㅣ', KeyZ: 'ㅋ', KeyX: 'ㅌ', KeyC: 'ㅊ', KeyV: 'ㅍ', KeyB: 'ㅠ',
    KeyN: 'ㅜ', KeyM: 'ㅡ' };
  const SHIFT = { KeyQ: 'ㅂㅂ', KeyW: 'ㅈㅈ', KeyE: 'ㄷㄷ', KeyR: 'ㄱㄱ', KeyT: 'ㅅㅅ', KeyO: 'ㅑㅣ', KeyP: 'ㅕㅣ' };
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // 마지막으로 누른 버튼(힌트·화면 키)에 포커스가 남아 Enter가 그 버튼까지 누르지 않도록 막습니다.
    if (e.key === 'Enter') { e.preventDefault(); return press('입력'); }
    if (e.key === 'Backspace') return press('⌫');
    const s = (e.shiftKey && SHIFT[e.code]) || CODE[e.code];
    if (s) { e.preventDefault(); [...s].forEach(press); }
  });

  function press(k) {
    if (done) return;
    if (k === '⌫') cur.pop();
    else if (k === '입력') return submit();
    else if (cur.length < COLS) cur.push(k);
    draw();
  }

  function draw() {
    for (let i = 0; i < COLS; i++) {
      const t = tiles[row * COLS + i];
      t.textContent = cur[i] || '';
      t.classList.toggle('filled', !!cur[i]);
    }
    $('msg').textContent = '';
  }

  function submit() {
    if (cur.length < COLS) return say(`자모 ${COLS}개를 채워 주세요.`);
    if (!valid.has(cur.join(''))) return say('사전에 없는 단어입니다.');
    const res = judge(cur, answer);
    res.forEach((c, i) => {
      tiles[row * COLS + i].classList.add(c);
      const key = keys[cur[i]];
      const prev = ['g', 'y', 'b'].find(x => key.classList.contains(x));
      if (!prev || rank[c] > rank[prev]) { key.classList.remove('b', 'y', 'g'); key.classList.add(c); }
    });
    history.push(res);
    row++;
    const win = res.every(c => c === 'g');
    if (win || row === ROWS) {
      done = true;
      $('hintBtn').disabled = true;
      $('msg').innerHTML = '';
      $('msg').append(
        win ? `정답! ${row}번 만에 맞혔습니다. ` : '아쉽네요. ',
        `정답: ${answerWord} `,
        Object.assign(document.createElement('a'), {
          href: `https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=${encodeURIComponent(answerWord)}`,
          target: '_blank', textContent: '[뜻 보기]'
        }),
        document.createElement('br'),
        Object.assign(document.createElement('button'), {
          textContent: '결과 복사', onclick: () => share(win)
        }));
    }
    cur = [];
  }

  // 정답 글자는 빼고 색만 공유
  function share(win) {
    const EMOJI = { g: '🟩', y: '🟨', b: '⬜' };
    const text = [
      `자모 맞추기 ${date} · ${num}번 · ${LEVELS[level].name} · 자모 ${COLS}개 ${win ? row : 'X'}/${ROWS}${hintsUsed ? ` 💡${hintsUsed}` : ''}`,
      ...history.map(r => r.map(c => EMOJI[c]).join('')),
      `${location.origin}${location.pathname}?n=${num}&d=${level}`
    ].join('\n');
    navigator.clipboard.writeText(text)
      .then(() => alert('결과를 복사했습니다.'))
      .catch(() => prompt('아래 내용을 복사하세요.', text));
  }

  function say(text) { $('msg').textContent = text; }
}
</script>
</body>
</html>
